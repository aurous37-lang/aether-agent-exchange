name: Sim V2

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario filter (e.g. "auth", "bidding", "dispute", "all")'
        required: false
        default: 'all'
        type: string
      seed:
        description: 'Random seed for deterministic simulation runs'
        required: false
        default: ''
        type: string

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate

      - name: Initialize database
        run: cd backend && npx prisma db push

      - name: Start backend server
        run: |
          cd backend
          NODE_ENV=development npx tsx src/server.ts &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

          # Wait for health check
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null 2>&1; then
              echo "Server is healthy (took ${i}s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 30s"
              exit 1
            fi
            sleep 1
          done

      - name: Run Sim V2 (stress-test)
        env:
          AAE_SIM_SCENARIO: ${{ inputs.scenario }}
          AAE_SIM_SEED: ${{ inputs.seed }}
        run: cd backend && npx tsx test-env/stress-test.ts

      - name: Stop backend server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-v2-results-${{ github.run_number }}
          path: audits/simulation-results/
          retention-days: 30
